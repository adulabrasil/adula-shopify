name: Auditar vínculos de fotos douradas e pratas

on:
  push:
    branches:
      - Adula-Shopify
    paths:
      - scripts/audit-variant-finish-media.mjs
      - .github/workflows/audit-variant-finish-media.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-variant-finish-media
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar análise de imagens
        run: npm install --no-save sharp@0.34.3

      - name: Auditar vínculos sem alterar a Shopify
        env:
          SHOPIFY_SHOP: adula-brasil.myshopify.com
          SHOPIFY_CLIENT_ID: 6175b96f9fd42bda41dd25b1adc49757
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          OUTPUT_DIR: variant-finish-media-audit
        run: node scripts/audit-variant-finish-media.mjs

      - name: Registrar relatório no repositório
        run: |
          mkdir -p reports
          cp variant-finish-media-audit/report.json reports/variant-finish-media-audit.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/variant-finish-media-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Registra auditoria de fotos douradas e pratas"
            git push
          fi

      - name: Salvar relatório da auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-vinculos-fotos-douradas-pratas
          path: variant-finish-media-audit/
          if-no-files-found: warn
          retention-days: 30
