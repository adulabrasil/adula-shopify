name: Otimizar SEO de produtos e coleções

on:
  workflow_dispatch:
  push:
    branches:
      - Adula-Shopify
    paths:
      - scripts/optimize-store-seo.mjs
      - .github/workflows/optimize-store-seo.yml

permissions:
  contents: read

concurrency:
  group: optimize-store-seo
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Aplicar títulos e descrições SEO
        env:
          SHOPIFY_SHOP: adula-brasil.myshopify.com
          SHOPIFY_CLIENT_ID: 6175b96f9fd42bda41dd25b1adc49757
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          APPLY_CHANGES: 'true'
        run: node scripts/optimize-store-seo.mjs

      - name: Salvar relatório da atualização
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-seo-produtos-colecoes
          path: seo-report/
          if-no-files-found: warn
          retention-days: 30
