name: Remover fotos duplicadas confirmadas

on:
  workflow_dispatch:
  push:
    branches:
      - Adula-Shopify
    paths:
      - .github/workflows/remove-duplicate-product-images.yml

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar processador de imagens
        run: npm install --no-save --ignore-scripts=false sharp@0.34.4

      - name: Auditar novamente e excluir somente as duplicatas aprovadas
        env:
          SHOPIFY_SHOP: adula-brasil.myshopify.com
          SHOPIFY_CLIENT_ID: 6175b96f9fd42bda41dd25b1adc49757
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          OUTPUT_DIR: duplicate-image-cleanup
          APPLY_DELETIONS: 'true'
          EXPECTED_SAFE_DUPLICATES: '1178'
        run: node scripts/audit-duplicate-product-images.mjs

      - name: Disponibilizar relatório da limpeza
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-limpeza-fotos-duplicadas
          path: duplicate-image-cleanup/
          if-no-files-found: warn
          retention-days: 30
