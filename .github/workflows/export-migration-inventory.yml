name: Inventariar URLs para migração SEO

on:
  push:
    branches:
      - agent/seo-migration-inventory
    paths:
      - .github/workflows/export-migration-inventory.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Consultar catálogo da Shopify
        env:
          SHOPIFY_SHOP: adula-brasil.myshopify.com
          SHOPIFY_CLIENT_ID: 6175b96f9fd42bda41dd25b1adc49757
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          cat > /tmp/export-inventory.mjs <<'NODE'
          import fs from 'node:fs/promises';

          const shop = process.env.SHOPIFY_SHOP;
          const response = await fetch(`https://${shop}/admin/oauth/access_token`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              grant_type: 'client_credentials',
              client_id: process.env.SHOPIFY_CLIENT_ID,
              client_secret: process.env.SHOPIFY_CLIENT_SECRET,
            }),
          });
          if (!response.ok) throw new Error(`Falha ao autenticar: ${response.status}`);
          const { access_token: token } = await response.json();

          async function graphql(query, variables = {}) {
            const result = await fetch(`https://${shop}/admin/api/2026-07/graphql.json`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-Shopify-Access-Token': token,
              },
              body: JSON.stringify({ query, variables }),
            });
            const body = await result.json();
            if (!result.ok || body.errors) throw new Error(JSON.stringify(body.errors || body));
            return body.data;
          }

          async function paginate(query, field) {
            const nodes = [];
            let after = null;
            do {
              const data = await graphql(query, { after });
              nodes.push(...data[field].nodes);
              after = data[field].pageInfo.hasNextPage ? data[field].pageInfo.endCursor : null;
            } while (after);
            return nodes;
          }

          const products = await paginate(`
            query InventoryProducts($after: String) {
              products(first: 100, after: $after, sortKey: ID) {
                pageInfo { hasNextPage endCursor }
                nodes {
                  handle title status
                  options { name values }
                }
              }
            }
          `, 'products');

          const collections = await paginate(`
            query InventoryCollections($after: String) {
              collections(first: 100, after: $after, sortKey: ID) {
                pageInfo { hasNextPage endCursor }
                nodes { handle title }
              }
            }
          `, 'collections');

          const pages = await paginate(`
            query InventoryPages($after: String) {
              pages(first: 100, after: $after, sortKey: ID) {
                pageInfo { hasNextPage endCursor }
                nodes { handle title isPublished }
              }
            }
          `, 'pages');

          const report = {
            generatedAt: new Date().toISOString(),
            shop,
            counts: {
              products: products.length,
              activeProducts: products.filter((p) => p.status === 'ACTIVE').length,
              collections: collections.length,
              pages: pages.length,
            },
            products,
            collections,
            pages,
          };

          await fs.mkdir('migration-inventory', { recursive: true });
          await fs.writeFile('migration-inventory/shopify-inventory.json', JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report.counts));
          NODE
          node /tmp/export-inventory.mjs

      - name: Salvar inventário
        uses: actions/upload-artifact@v4
        with:
          name: inventario-shopify-migracao-seo
          path: migration-inventory/
          retention-days: 14
          if-no-files-found: error
