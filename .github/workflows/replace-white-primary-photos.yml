name: Melhorar fotos principais com fundo branco

on:
  workflow_dispatch:
  push:
    branches:
      - Adula-Shopify
    paths:
      - scripts/replace-white-primary-photos.mjs
      - .github/workflows/replace-white-primary-photos.yml

permissions:
  contents: read

concurrency:
  group: replace-white-primary-photos
  cancel-in-progress: false

jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar tratamento de imagens
        run: npm install --no-save sharp@0.34.3

      - name: Substituir fotos principais validadas
        env:
          SHOPIFY_SHOP: adula-brasil.myshopify.com
          SHOPIFY_CLIENT_ID: 6175b96f9fd42bda41dd25b1adc49757
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          APPLY_CHANGES: 'true'
          EXPECTED_TARGETS: '790'
          OUTPUT_DIR: white-primary-photo-report
        run: node scripts/replace-white-primary-photos.mjs

      - name: Salvar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-fotos-principais-brancas
          path: white-primary-photo-report/
          if-no-files-found: warn
          retention-days: 30
