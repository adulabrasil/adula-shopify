name: Substituir fotos de produtos aprovadas
# Lote aprovado em 18/08/2026 — segunda execução após validar os handles da Shopify.

on:
  workflow_dispatch:
  push:
    branches:
      - Adula-Shopify
    paths:
      - .github/workflows/replace-approved-product-photos.yml

permissions:
  contents: read

concurrency:
  group: replace-approved-product-photos
  cancel-in-progress: false

jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Substituir o conteúdo das fotos sem criar novas mídias
        env:
          SHOPIFY_SHOP: adula-brasil.myshopify.com
          SHOPIFY_CLIENT_ID: 6175b96f9fd42bda41dd25b1adc49757
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          APPLY_CHANGES: 'true'
          EXPECTED_REPLACEMENTS: '3'
          OUTPUT_DIR: product-photo-replacement-report
        run: node scripts/replace-approved-product-photos.mjs

      - name: Salvar relatório da substituição
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-substituicao-fotos
          path: product-photo-replacement-report/
          if-no-files-found: warn
          retention-days: 30
