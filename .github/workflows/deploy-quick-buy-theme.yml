name: Publicar compra rápida no tema

on:
  push:
    branches:
      - Adula-Shopify
    paths:
      - assets/adula-product-card-variants-v2.js
      - assets/adula-quick-buy.css
      - snippets/option-value.liquid
      - snippets/product-card.liquid
      - layout/theme.liquid
      - scripts/deploy-quick-buy-theme.mjs
      - .github/workflows/deploy-quick-buy-theme.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-quick-buy-theme
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publicar os arquivos da compra rápida no tema principal
        env:
          SHOPIFY_SHOP: adula-brasil.myshopify.com
          SHOPIFY_CLIENT_ID: 6175b96f9fd42bda41dd25b1adc49757
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: node scripts/deploy-quick-buy-theme.mjs
